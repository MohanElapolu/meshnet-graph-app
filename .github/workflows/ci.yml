name: MeshNet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint Python code
        run: uvx ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check Python syntax
        run: python -m compileall -q app helpers.py deforming_plate_dataset.py

      - name: Run lightweight pytest tests
        run: uv run --no-project --with pytest --with pydantic pytest tests/test_validation.py -v