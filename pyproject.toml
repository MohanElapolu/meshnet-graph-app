[project]
name = "meshnet-graph-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.3",
    "nvidia-physicsnemo>=2.2.2",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "tfrecord>=1.14.6",
    "torch>=2.11.0",
    "torch-geometric>=2.8.1",
    "torchvision>=0.26.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
extend-exclude = ["physicsnemo/"]